{% extends 'layout.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
    <div class="panel panel-default m-t-10">
        <!-- Default panel contents -->
        <div class="panel-heading">
            <span class="glyphicon glyphicon-th-list" aria-hidden="true"></span>
            {{ title }}
        </div>

        <!-- Table -->
        <table class="table table-bordered">
            <thead>
            <tr>
                <th>ID</th>
                <th>日期</th>
                <th>用户</th>
                <th>操作内容</th>
                <th>记录IP</th>
            </tr>
            </thead>
            <tbody>
            {% for obj in queryset %}
                <tr>
                    <th>{{ obj.id }}</th>
                    <th>{{ obj.timestamp }}</th>
                    <th>{{ obj.user }}</th>
                    <td>{{ obj.action }}</td>
                    <td>{{ obj.ip }}</td>
                </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
    <div class="clearfix">
        <ul class="pagination">
            {{ page_string }}
        </ul>
    </div>
{% endblock %}
