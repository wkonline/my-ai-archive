{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>注册成功 - 科诺智能业务平台</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #eef5f6;
            color: #203c44;
            font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
        }

        .success-card {
            width: min(460px, calc(100% - 32px));
            padding: 42px 36px;
            border: 1px solid #d5e4e6;
            border-radius: 8px;
            background: #ffffff;
            box-shadow: 0 20px 50px rgba(8, 31, 38, .14);
            text-align: center;
        }

        .success-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 58px;
            height: 58px;
            margin-bottom: 18px;
            border-radius: 50%;
            background: #e6f7f0;
            color: #23a46b;
            font-size: 28px;
            font-weight: 700;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 24px;
            font-weight: 700;
            color: #17363e;
            letter-spacing: 0;
        }

        p {
            margin: 0 0 24px;
            color: #617c84;
            font-size: 14px;
            line-height: 1.8;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 130px;
            height: 42px;
            padding: 0 18px;
            border: 0;
            border-radius: 6px;
            background: linear-gradient(135deg, #0d918d, #086f78);
            box-shadow: 0 8px 18px rgba(10, 112, 116, .18);
            color: #ffffff;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
        }

        .btn:hover {
            color: #ffffff;
            text-decoration: none;
            filter: brightness(1.06);
        }
    </style>
</head>
<body>
<div class="success-card">
    <div class="success-icon">✓</div>
    <h1>注册成功</h1>
    <p>账号已创建完成，请使用刚注册的用户名和密码登录。</p>
    <a class="btn" href="{{ url_path|default:'/login/' }}">前往登录</a>
</div>
</body>
</html>
