{% extends 'layout.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}

    <div class="panel panel-default">
        <div class="panel-heading">
            <h3 class="panel-title"> 修改维修信息 </h3>
        </div>
        <div class="panel-body">
            <form method="post" novalidate>
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_productcategory">产品名称</label>
                    <input type="text" name="productcategory" disabled class="form-control"
                           value="{{ row_object.customer }}"id="id_tproductcategory">
                </div>
                <div class="form-group">
                    <label for="id_productcategory">产品名称</label>
                    <input type="text" name="productcategory" disabled class="form-control"
                           value="{{ row_object.service.productcategory }}" id="id_tproductcategory">
                </div>
                <div class="form-group">
                    <label for="id_productcategory">产品型号</label>
                    <input type="text" name="productcategory" disabled class="form-control"
                           value="{{ row_object.service.product }}">
                </div>
                {% for field in form %}
                    <div class="form-group">
                        <label>{{ field.label }}</label>
                        {{ field }}
                        <span style="color: red;">{{ field.errors.0 }}</span>
                    </div>
                {% endfor %}
                <button type="submit" class="btn btn-primary">提 交</button>
            </form>
        </div>
    </div>
{% endblock %}
