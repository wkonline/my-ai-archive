{% extends 'layout.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}

    <div class="panel panel-default">
        <div class="panel-heading">
            <h3 class="panel-title"> 修改合同内容 </h3>
        </div>
        <div class="panel-body">
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label>产品数量</label>
                    <input type="text" class="form-control" placeholder="数量" name="quantity"
                           value="{{ row_object.quantity }}"/>
                    <label>产品单价</label>
                    <input type="text" class="form-control" placeholder="单价" name="unit_price"
                           value="{{ row_object.unit_price }}"/>
                </div>
                <button type="submit" class="btn btn-primary">提 交</button>
            </form>
        </div>
    </div>
{% endblock %}
