{% extends 'layout.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
    <div class="panel panel-default">
        <!-- Default panel contents -->
        <div class="panel-heading">
            <span class="glyphicon glyphicon-th-list" aria-hidden="true"></span>
            合同号：{{ title }}详细列表
        </div>

        <!-- Table -->
        <table class="table table-bordered">
            <thead>
            <tr>
                <th>ID</th>
                <th>产品名称</th>
                <th>型号</th>
                <th>数量</th>
                <th>单价</th>
                <th>金额</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            {% for obj in queryset %}
                <tr>
                    <th>{{ obj.id }}</th>
                    <th>{{ obj.name }}</th>
                    <th>{{ obj.model }}</th>
                    <th>{{ obj.quantity }}</th>
                    <th>{{ obj.unit_price }}</th>
                    <td>{{ obj.total_price }}</td>
                    <td>
                        <a class="btn btn-primary btn-xs" href="/contractdetail/{{ obj.id }}/edit/"><span
                                class="glyphicon glyphicon-wrench m-r-5" aria-hidden="true"></span>编辑</a>
                        <a class="btn btn-danger btn-xs" href="/contractdetail/delete/?nid={{ obj.id }}"><span
                                class="glyphicon glyphicon-trash m-r-5" aria-hidden="true"></span>删除</a>
                    </td>
                </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
