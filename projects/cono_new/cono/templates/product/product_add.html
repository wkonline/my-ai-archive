{% extends 'layout.html' %}
{% block title %}{{ title }}{% endblock %}
{% load static %}

{% block content %}
    <div class="panel panel-default">
        <div class="panel-heading">
            <h3 class="panel-title">{{ title }}</h3>
        </div>
        <div class="panel-body">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">提交</button>
            </form>
        </div>
    </div>
{% endblock %}
