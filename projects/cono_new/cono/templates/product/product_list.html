{% extends 'layout.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
    <div class=" clearfix">
        <div class="float-left">
            <a class="btn btn-success" href="/product/add/">
                <span class="glyphicon glyphicon-plus-sign" aria-hidden="true"></span>
                新增型号
            </a>
        </div>
        <div class=" float-right" style="width: 300px;">
            <form method="get">
                <div class="input-group">
                    <input type="text" name="keyword" class="form-control" placeholder="产品名称或型号...">
                    <span class="input-group-btn">
                        <button class="btn btn-info" type="submit">
                            <span class="glyphicon glyphicon-search" aria-hidden="true"></span>
                        </button>
                      </span>
                </div>
            </form>
        </div>
    </div>
    <div class="panel panel-default m-t-10">
        <!-- Default panel contents -->
        <div class="panel-heading">
            <span class="glyphicon glyphicon-th-list" aria-hidden="true"></span>
            产品型号列表
        </div>

        <!-- Table -->
        <table class="table table-bordered">
            <thead>
            <tr>
                <th>ID</th>
                <th>产品名称</th>
                <th>产品型号</th>
            </tr>
            </thead>
            <tbody>
            {% for obj in queryset %}
                <tr>
                    <td class="text-center">{{ forloop.counter }}</td>
                    <td>{{ obj.productcategory }}</td>
                    <td>{{ obj.model }}</td>
                    <td>
                        <a class="btn btn-primary btn-xs" href="/product/{{ obj.id }}/edit/"><span
                                class="glyphicon glyphicon-wrench m-r-5" aria-hidden="true"></span>编辑</a>
                        <a class="btn btn-danger btn-xs" onclick="showDeleteModal({{ obj.id }});"><span
                            class="glyphicon glyphicon-trash m-r-5" aria-hidden="true"></span>删除</a>
                    </td>
                </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
    <div class="clearfix">
        <ul class="pagination">
            {{ page_string }}
        </ul>
    </div>
    {% include 'delete.html' %}
    <script>
        function confirmDelete() {
            $.ajax({
                url: '{% url 'product_delete' %}',
                type: 'GET',
                data: {'nid': delete_id},
                dataType: 'json',
                success: function (data) {
                    if (data.status) {
                        location.reload()
                    } else {
                        (data.error)
                    }
                }
            })
        }
    </script>
{% endblock %}
