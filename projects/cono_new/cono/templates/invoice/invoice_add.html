{% extends 'layout.html' %}
{% block title %}{{ title }}{% endblock %}
{% load static %}

{% block css %}
    <link rel="stylesheet" href="{% static 'plugins/bootstrap-datepicker/css/bootstrap-datepicker.min.css' %}">
    <link rel="stylesheet" href="{% static 'plugins/select2/css/select2.min.css' %}">
    <script src={% static 'plugins/select2/js/select2.min.js' %}></script>
{% endblock %}

{% block content %}
    <div class="panel panel-default">
        <div class="panel-heading">
            <h3 class="panel-title">{{ title }}</h3>
        </div>
        <div class="panel-body">
            <form method="post" novalidate>
                {% csrf_token %}
                <label for="id_customer">客户名称:</label>
                <select name="customer" class="form-control"  id="id_customer" >
                    <!-- 这里应该是从数据库动态加载的客户名称 -->
                </select>
                <label for="contract_select">合同号:</label>
                <select id="contract_select" name="contract" class="form-control" >
                    <!-- 合同号将在这里通过Ajax动态加载 -->
                </select>
                {% for field in form %}
                    <div class="form-group">
                        <label>{{ field.label }}</label>
                        {{ field }}
                        <span style="color: red;">{{ field.errors.0 }}</span>
                    </div>
                {% endfor %}
                <button type="submit" class="btn btn-primary">提 交</button>
            </form>
        </div>
    </div>
    <script>
        $(document).ready(function () {
            $('#id_customer').select2({
                ajax: {
                    url: '{% url 'search_companys' %}',
                    dataType: 'json',
                    delay: 250, // 等待用户停止输入后再进行搜索（以毫秒为单位）
                    data: function (params) {
                        return {
                            q: params.term, // 搜索词
                            page: params.page
                        };
                    },
                    processResults: function (data) {
                        // 解析从服务器返回的数据
                        return {
                            results: $.map(data, function (item) {
                                return {
                                    id: item.id,
                                    text: item.company_name
                                };
                            })
                        };
                    },
                    cache: true
                },
                placeholder: '请选择一个客户',
                minimumInputLength: 1 // 开始搜索前用户必须输入的最小字符数
            });
        });
    </script>
    <script>
        // 使用jQuery或原生JS处理AJAX和DOM操作
        $('#id_customer').change(function() {
            var customer_id = $(this).val();
            $.ajax({
                url: '{% url 'get_collection_contracts' %}',
                data: { 'customer_id': customer_id },
                success: function(data) {
                    var $contract_select = $('#contract_select');
                    $contract_select.empty();
                    $.each(data, function(index, contract) {
                        $contract_select.append($('<option>', {
                            value: contract.id,
                            text: contract.contract_number
                        }));
                    });
                }
            });
        });
    </script>
{% endblock %}
{% block js %}
    <script src="{% static 'plugins/bootstrap-datepicker/js/bootstrap-datepicker.js' %}"></script>
    <script src="{% static '/js/script.js' %}"></script>
    <script src="{% static 'plugins/bootstrap-datepicker/locales/bootstrap-datepicker.zh-CN.min.js' %}"></script>
    <script>
        $(function () {
            $('#id_date').datepicker({
                format: 'yyyy-mm-dd',
                startDate: '0',
                language: "zh-CN",
                autoclose: true
            });

        })
    </script>
{% endblock %}
