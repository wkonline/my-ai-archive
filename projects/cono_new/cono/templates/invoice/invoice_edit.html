{% extends 'layout.html' %}
{% block title %}{{ title }}{% endblock %}
{% load static %}

{% block css %}
    <link rel="stylesheet" href="{% static 'plugins/bootstrap-datepicker/css/bootstrap-datepicker.min.css' %}">
{% endblock %}

{% block content %}

    <div class="panel panel-default">
        <div class="panel-heading">
            <h3 class="panel-title"> 发票登记编辑</h3>
        </div>
        <div class="panel-body">
            <form method="post" novalidate>
                {% csrf_token %}
                <label>客户名称:</label>
                <input type="text" name="customer" value="{{ form.instance.customer }}" disabled class="form-control"
                       placeholder="客户名称"
                       required id="id_customer">
                <label>合同号:</label>
                <input type="text" name="customer" value="{{ form.instance.contract }}" disabled class="form-control"
                       placeholder="合同号码"
                       required id="id_contract">
                {% for field in form %}
                    <div class="form-group">
                        <label>{{ field.label }}</label>
                        {{ field }}
                        <span style="color: red;">{{ field.errors.0 }}</span>
                    </div>
                {% endfor %}
                <button type="submit" class="btn btn-primary">提 交</button>
            </form>
        </div>
    </div>

{% endblock %}

{% block js %}
    <script src="{% static 'plugins/bootstrap-datepicker/js/bootstrap-datepicker.js' %}"></script>
    <script src="{% static 'plugins/bootstrap-datepicker/locales/bootstrap-datepicker.zh-CN.min.js' %}"></script>
    <script>
        $(function () {
            $('#id_collection_time').datepicker({
                format: 'yyyy-mm-dd',
                startDate: '-333333',
                language: "zh-CN",
                autoclose: true
            });

        })
    </script>
{% endblock %}
