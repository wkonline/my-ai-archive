{% extends 'layout.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
    <div>
        <a class="btn btn-success" href="/department/add/">
            <span class="glyphicon glyphicon-plus-sign" aria-hidden="true"></span>
            新建部门
        </a>
    </div>
    <div class="panel panel-default m-t-10">
        <!-- Default panel contents -->
        <div class="panel-heading">
            <span class="glyphicon glyphicon-th-list" aria-hidden="true"></span>
            {{ title }}
        </div>

        <!-- Table -->
        <table class="table table-bordered">
            <thead>
            <tr>
                <th>ID</th>
                <th>名称</th>
                <th>描述</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            {% for obj in queryset %}
                <tr>
                    <th>{{ obj.id }}</th>
                    <th>{{ obj.title }}</th>
                    <td>{{ obj.description }}</td>
                    <td>
                        <a class="btn btn-primary btn-xs" href="/department/{{ obj.id }}/edit/"><span
                                class="glyphicon glyphicon-wrench m-r-5" aria-hidden="true"></span>编辑</a>
                        <a class="btn btn-danger btn-xs" onclick="showDeleteModal({{ obj.id }});"><span
                                class="glyphicon glyphicon-trash m-r-5" aria-hidden="true"></span>删除</a>
                    </td>
                </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
    {% include 'delete.html' %}
    <script>
        function confirmDelete() {
            $.ajax({
                url: '{% url 'department_delete' %}',
                type: 'GET',
                data: {'nid': delete_id},
                dataType: 'json',
                success: function (data) {
                    if (data.status) {
                        location.reload()
                    } else {
                        (data.error)
                    }
                }
            })
        }
    </script>
{% endblock %}
