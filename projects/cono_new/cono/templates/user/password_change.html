{% extends 'layout.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="container" style="padding: 20px 0;">
    <div class="row">
        <div class="col-md-6 col-md-offset-3">
            <div class="panel panel-default">
                <div class="panel-heading">
                    <span class="glyphicon glyphicon-lock"></span> 修改密码
                    <div class="pull-right">
                        <a href="/user/profile/" class="btn btn-default btn-xs">
                            <span class="glyphicon glyphicon-arrow-left"></span> 返回
                        </a>
                    </div>
                </div>
                <div class="panel-body">
                    <div class="alert alert-info">
                        <span class="glyphicon glyphicon-info-sign"></span>
                        请妥善保管密码，不要透露给他人。密码长度至少6位。
                    </div>
                    <form method="post" class="form-horizontal">
                        {% csrf_token %}
                        {% for field in form %}
                        <div class="form-group {% if field.errors %}has-error{% endif %}">
                            <label class="col-sm-3 control-label">{{ field.label }}</label>
                            <div class="col-sm-8">
                                {{ field }}
                                {% if field.errors %}
                                    <span class="help-block">{{ field.errors|first }}</span>
                                {% endif %}
                            </div>
                        </div>
                        {% endfor %}
                        <div class="form-group">
                            <div class="col-sm-8 col-sm-offset-3">
                                <button type="submit" class="btn btn-primary">
                                    <span class="glyphicon glyphicon-refresh"></span> 确认修改
                                </button>
                                <a href="/user/profile/" class="btn btn-default">取消</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
