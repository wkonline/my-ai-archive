# 新版前后端分离系统 · NAS 部署参考
#
# 线上实际由 deploy/sync_new_to_nas.sh 用 docker run 管理；本文件是等价的手动重建方式，
# 配置必须与脚本保持一致：host 网络、API 监听 8002、整仓挂载到 /app、工作目录 /app/api。
#
# 用法：cd /volume1/docker/cono_app && sudo -n docker compose -f deploy/docker-compose.new.yml up -d --build
# 注意：cono_db（MySQL）与老版 cono_web 由老系统自行管理，不在本文件内，避免误重建。
services:
  cono_api:
    build: ../api
    image: cono_api:latest
    container_name: cono_api
    restart: unless-stopped
    network_mode: host
    working_dir: /app/api
    command: gunicorn cono_api.wsgi:application --bind 0.0.0.0:8002 --workers 2 --timeout 120
    environment:
      DJANGO_SECRET_KEY: nas-cono-new-api-key-2026
      # 老密码哈希 = md5(cono_web 的 SECRET_KEY + 明文)，必须与老系统容器一致
      LEGACY_SECRET_KEY: nas-cono-deploy-key-2026
      DJANGO_DEBUG: "false"
      USE_MYSQL: "1"
      DJANGO_DB_NAME: cono
      DJANGO_DB_USER: cono
      DJANGO_DB_PASSWORD: cono2024
      DJANGO_DB_HOST: 192.168.1.201
      DJANGO_DB_PORT: "3306"
    volumes:
      - /volume1/docker/cono_app:/app
      - /volume1/docker/cono_media:/app/media
      - /volume1/docker/cono_backups:/app/backups

  cono_web_new:
    image: nginx:alpine
    container_name: cono_web_new
    restart: unless-stopped
    network_mode: host
    volumes:
      - /volume1/docker/cono_app/frontend/dist:/usr/share/nginx/html:ro
      - /volume1/docker/cono_app/deploy/nginx-new.conf:/etc/nginx/conf.d/default.conf:ro
      - /volume1/docker/cono_media:/volume1/docker/cono_media:ro
