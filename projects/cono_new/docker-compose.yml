services:
  db:
    image: docker.1ms.run/mysql:latest
    container_name: cono_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ConoRoot2024
      MYSQL_DATABASE: cono
      MYSQL_USER: cono
      MYSQL_PASSWORD: cono2024
    volumes:
      - /volume1/docker/cono_mysql:/var/lib/mysql
    ports:
      - "3306:3306"

  web:
    build: .
    container_name: cono_web
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: nas-cono-deploy-key-2026
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "192.168.1.202,localhost,127.0.0.1"
      DJANGO_DB_HOST: db
      DJANGO_DB_PORT: "3306"
      DJANGO_DB_NAME: cono
      DJANGO_DB_USER: cono
      DJANGO_DB_PASSWORD: cono2024
    volumes:
      - /volume1/docker/cono_media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      - db

